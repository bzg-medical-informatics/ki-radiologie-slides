<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="1200" height="700" fill="#f7f8fa"/>
<text x="600" y="62" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#20252b">Wenige Befunde, viele Bilder</text>
<text x="600" y="102" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#59636e">Die geprüften Beispiele helfen, den Rest einzuordnen</text>
<g transform="translate(80 160)"><rect width="300" height="300" rx="20" fill="#e6f4eb" stroke="#318454" stroke-width="5"/><text x="150" y="45" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#23633e">wenige geprüft</text><g fill="#a9c5b2" stroke="#548369" stroke-width="3"><ellipse cx="90" cy="135" rx="28" ry="52"/><ellipse cx="210" cy="135" rx="28" ry="52"/><path d="M150 83v105M78 112h144M78 143h144" fill="none"/></g><text x="150" y="255" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#23633e">Befund bekannt</text></g>
<path d="M410 310h125" stroke="#e27d32" stroke-width="10" fill="none"/><path d="m520 285 35 25-35 25" fill="none" stroke="#e27d32" stroke-width="10"/>
<g transform="translate(560 205)"><rect width="230" height="150" rx="20" fill="#fff0df" stroke="#e27d32" stroke-width="5"/><text x="115" y="65" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#9a4a12">KI lernt</text><text x="115" y="104" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#9a4a12">gemeinsame Muster</text></g>
<path d="M820 310h105" stroke="#e27d32" stroke-width="10" fill="none"/><path d="m910 285 35 25-35 25" fill="none" stroke="#e27d32" stroke-width="10"/>
<g transform="translate(950 160)"><rect width="180" height="300" rx="20" fill="#edf0f3" stroke="#77828c" stroke-width="5"/><text x="90" y="45" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold" fill="#4e5962">viele offen</text><g fill="#c2c9cf" stroke="#77828c" stroke-width="3"><ellipse cx="55" cy="120" rx="20" ry="38"/><ellipse cx="125" cy="120" rx="20" ry="38"/><path d="M90 82v77M43 106h94" fill="none"/><ellipse cx="55" cy="215" rx="20" ry="38"/><ellipse cx="125" cy="215" rx="20" ry="38"/><path d="M90 177v77M43 201h94" fill="none"/></g><text x="90" y="275" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#4e5962">ohne Befund</text></g>
<text x="600" y="555" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#20252b">Spart Zeit, ersetzt aber nicht die fachliche Kontrolle.</text>
</svg>